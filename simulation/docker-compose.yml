version: '3.9'

services:
  sitl:
    # Profile: Simulation
    # Defines this service as part of the 'sim' group.
    profiles: ["sim"]
    
    image: jeson_ecosys/simulation:latest
    container_name: amr_sim
    network_mode: host
    
    # Security: Removed 'privileged: true'
    # Replaced with specific capabilities and device mappings
    cap_add:
      - SYS_NICE # Required for real-time scheduling in SITL
    
    devices:
      - /dev/dri:/dev/dri # GPU acceleration for Gazebo
      # Add other devices here only if needed (e.g., /dev/input)

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./:/home/dev/workspace/shared:rw

    # Ensure container stays alive for exec commands
    command: bash -c "while true; do sleep 3600; done"
